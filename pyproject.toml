[project]
name = "iops-labs-local-tooling"
version = "0.1.0.dev0"
description = "Private development tooling; not a distributable Labs product"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "jsonschema>=4.23,<5",
  "rfc3339-validator>=0.1.4,<0.2",
  "referencing>=0.35,<1",
  "build>=1.2,<2",
  "setuptools>=75,<85",
  "wheel>=0.45,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-jsonschema>=4.23,<5",
  "pip-audit==2.10.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["contracts/tests"]
addopts = "--import-mode=importlib"
faulthandler_timeout = 60

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["contracts/reference/python", "products/permissions/src", "products/crashlab/src", "scripts"]
